name: обновления-отзывы

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox-esr
          which firefox
          firefox --version

      - name: Скачать парсер
        run: |
          git clone https://github.com/filippchistiakov/YandexMapsReviewsParser.git parser-source

      - name: Установить зависимости
        run: |
          pip install -r parser-source/requirements.txt

      - name: Настроить Firefox
        run: |
          sed -i "/options.page_load_strategy/a\\    options.binary_location = '/usr/bin/firefox'" parser-source/parser/selenium_helper.py

      - name: Запустить парсер
        run: |
          cd parser-source
          python run.py --org_id 210582373621 --mode reviews

      - name: Найти JSON
        run: |
          find parser-source -type f -name "*.json" -print

      - name: Преобразовать отзывы
        run: |
          python -c '
          import json, glob, os

          files = glob.glob("parser-source/**/*.json", recursive=True)
          files = [f for f in files if os.path.basename(f) != "reviews.json"]

          if not files:
              raise RuntimeError("JSON с отзывами не найден")

          latest = max(files, key=os.path.getmtime)

          with open(latest, "r", encoding="utf-8") as f:
              source = json.load(f)

          items = source if isinstance(source, list) else source.get("reviews", [])
          result = []

          for item in items:
              author = item.get("author") or {}
              rating = item.get("review_rating") or {}
              dates = item.get("datetime") or {}

              author_name = author.get("name", "") if isinstance(author, dict) else str(author)
              rating_value = rating.get("ratingValue", 0) if isinstance(rating, dict) else rating
              date_value = dates.get("datePublished", "") if isinstance(dates, dict) else ""

              if isinstance(author_name, list):
                  author_name = " ".join(map(str, author_name))

              result.append({
                  "text": item.get("review_text", ""),
                  "author": author_name,
                  "rating": rating_value,
                  "date": date_value
              })

          with open("reviews.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("Получено отзывов:", len(result))
          '

      - name: Сохранить отзывы
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add reviews.json

          if git diff --cached --quiet; then
            echo "Новых изменений нет"
          else
            git commit -m "Обновить отзывы"
            git push
          fi
