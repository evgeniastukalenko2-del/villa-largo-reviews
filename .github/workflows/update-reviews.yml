name: обновления-отзывы

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Проверить Firefox
        run: |
          echo "Firefox: ${{ steps.firefox.outputs.firefox-path }}"
          "${{ steps.firefox.outputs.firefox-path }}" --version

      - name: Скачать парсер
        run: |
          git clone https://github.com/filippchistiakov/YandexMapsReviewsParser.git parser-source

      - name: Установить зависимости
        run: |
          pip install -r parser-source/requirements.txt

      - name: Настроить Firefox для Selenium
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("parser-source/parser/selenium_helper.py")
          text = path.read_text(encoding="utf-8")

          if "import os" not in text:
              text = "import os\n" + text

          old = "options = Options()"
          new = "options = Options()\n    options.binary_location = os.environ['FIREFOX_BIN']"

          if "options.binary_location" not in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          print("Firefox для Selenium настроен")
          PY

      - name: Запустить парсер
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          cd parser-source
          mkdir -p json
          python run.py --org_id 210582373621 --mode reviews
                - name: Обновить reviews.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(
              Path("parser-source/json").glob("210582373621_reviews_*.json"),
              key=lambda p: p.stat().st_mtime,
              reverse=True
          )

          if not files:
              raise FileNotFoundError("Файл с отзывами не найден")

          source_file = files[0]
          print(f"Берём файл: {source_file}")

          data = json.loads(source_file.read_text(encoding="utf-8"))

          reviews = []

          for item in data:
              author = item.get("author", {})
              rating = item.get("review_rating", {})

              date = ""
              datetime_data = item.get("datetime", [])

              if isinstance(datetime_data, list):
                  for dt in datetime_data:
                      if isinstance(dt, dict) and dt.get("datePublished"):
                          date = dt["datePublished"]
                          break

              reviews.append({
                  "text": item.get("review_text", ""),
                  "author": author.get("name", ""),
                  "rating": rating.get("ratingValue", 0),
                  "date": date
              })

          Path("reviews.json").write_text(
              json.dumps(reviews, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(f"Сохранено отзывов: {len(reviews)}")
          PY
                - name: Сохранить reviews.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add reviews.json

          if git diff --cached --quiet; then
            echo "Изменений в reviews.json нет"
          else
            git commit -m "Обновить отзывы"
            git push
          fi

      - name: Найти результаты парсера
        run: |
          echo "JSON-файлы:"
          find parser-source -type f -name "*.json" -print

      - name: Проверить результаты
        run: |
          COUNT=$(find parser-source -type f -name "*.json" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "Парсер не создал JSON"
            exit 1
          fi

          echo "Найдено JSON-файлов: $COUNT"

      - name: Сохранить изменения
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add reviews.json

          if git diff --cached --quiet; then
            echo "Новых изменений нет"
          else
            git commit -m "Обновить отзывы"
            git push
          fi
