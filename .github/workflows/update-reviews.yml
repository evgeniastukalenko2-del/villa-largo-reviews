name: обновления-отзывы

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Проверить Firefox
        run: |
          echo "Firefox: ${{ steps.firefox.outputs.firefox-path }}"
          "${{ steps.firefox.outputs.firefox-path }}" --version

      - name: Скачать парсер
        run: |
          git clone https://github.com/filippchistiakov/YandexMapsReviewsParser.git parser-source

      - name: Установить зависимости
        run: |
          pip install -r parser-source/requirements.txt

      - name: Настроить Firefox для Selenium
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("parser-source/parser/selenium_helper.py")
          text = path.read_text(encoding="utf-8")

          if "import os" not in text:
              text = "import os\n" + text

          old = "options = Options()"
          new = "options = Options()\n    options.binary_location = os.environ['FIREFOX_BIN']"

          if "options.binary_location" not in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          print("Firefox для Selenium настроен")
          PY

      - name: Запустить парсер
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          cd parser-source
          mkdir -p json
          python run.py --org_id 210582373621 --mode reviews

      - name: Обновить reviews.json
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          files = sorted(
              Path("parser-source/json").glob("210582373621_reviews_*.json"),
              key=lambda p: p.stat().st_mtime,
              reverse=True
          )

          if not files:
              raise FileNotFoundError("Файл с отзывами не найден")

          source_file = files[0]
          print(f"Берём файл: {source_file}")

          data = json.loads(
              source_file.read_text(encoding="utf-8")
          )

          reviews = []

          date_pattern = re.compile(
              r"^(January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2}(?:,\s+\d{4})?$",
              re.IGNORECASE
          )

          expert_pattern = re.compile(
              r"^Level\s+\d+\s+Local Expert$",
              re.IGNORECASE
          )

          subscribe_pattern = re.compile(
              r"^Subscribe$",
              re.IGNORECASE
          )

          def extract_author(item, lines):
              author_data = item.get("author")

              # Если автор уже строка
              if isinstance(author_data, str):
                  value = author_data.strip()
                  if value:
                      return value

              # Если автор массив
              if isinstance(author_data, list):
                  for value in reversed(author_data):
                      if isinstance(value, str) and value.strip():
                          return value.strip()

              # Если автор объект
              if isinstance(author_data, dict):
                  value = author_data.get("name")
                  if isinstance(value, str) and value.strip():
                      return value.strip()

              # Запасной вариант: первая строка review_text
              if lines:
                  return lines[0].strip()

              return ""

          def extract_rating(item):
              rating_data = item.get("review_rating")

              if isinstance(rating_data, (int, float)):
                  return int(float(rating_data))

              if isinstance(rating_data, str):
                  try:
                      return int(float(rating_data))
                  except ValueError:
                      pass

              if isinstance(rating_data, list):
                  for value in rating_data:
                      try:
                          rating = int(float(value))
                          if 1 <= rating <= 5:
                              return rating
                      except (TypeError, ValueError):
                          continue

              if isinstance(rating_data, dict):
                  value = rating_data.get("ratingValue")
                  try:
                      rating = int(float(value))
                      if 1 <= rating <= 5:
                          return rating
                  except (TypeError, ValueError):
                      pass

              return 0

          for item in data:
              raw_text = item.get("review_text", "")

              if not isinstance(raw_text, str):
                  raw_text = ""

              lines = raw_text.splitlines()

              # Убираем пустые строки в начале
              while lines and not lines[0].strip():
                  lines.pop(0)

              # Получаем автора
              author = extract_author(item, lines)

              # Убираем имя автора из review_text
              if lines and author and lines[0].strip() == author:
                  lines.pop(0)

              # Удаляем служебную информацию
              while lines and not lines[0].strip():
                  lines.pop(0)

              if lines and expert_pattern.match(lines[0].strip()):
                  lines.pop(0)

              while lines and not lines[0].strip():
                  lines.pop(0)

              if lines and subscribe_pattern.match(lines[0].strip()):
                  lines.pop(0)

              while lines and not lines[0].strip():
                  lines.pop(0)

              # Получаем дату
              date = ""

              if lines and date_pattern.match(lines[0].strip()):
                  date = lines[0].strip()
                  lines.pop(0)

              # Убираем пустые строки после даты
              while lines and not lines[0].strip():
                  lines.pop(0)

              # Убираем служебные элементы в конце отзыва
              cleaned_lines = []

              for line in lines:
                  stripped = line.strip()

                  if stripped.lower() == "more":
                      break

                  if stripped.lower() == "show business's response":
                      break

                  if re.fullmatch(r"\d+", stripped):
                      continue

                  cleaned_lines.append(line)

              text = "\n".join(cleaned_lines).strip()

              rating = extract_rating(item)

              reviews.append({
                  "text": text,
                  "author": author,
                  "rating": rating,
                  "date": date
              })

          Path("reviews.json").write_text(
              json.dumps(
                  reviews,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(f"Сохранено отзывов: {len(reviews)}")
          PY

      - name: Сохранить reviews.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add reviews.json

          if git diff --cached --quiet; then
            echo "Изменений в reviews.json нет"
          else
            git commit -m "Обновить отзывы"
            git push
          fi
